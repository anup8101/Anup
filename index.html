    // --- Main App Component ---
    function ApnaKamraApp() {
      const [lang, setLang] = useState(() => localStorage.getItem("ak_lang") || "hi");
      const [budget, setBudget] = useState(5000);
      const [selectedLocality, setSelectedLocality] = useState("all");
      const [searchQuery, setSearchQuery] = useState("");
      const [toiletFilter, setToiletFilter] = useState("all"); // 'all' or 'personal'
      const [meterFilter, setMeterFilter] = useState("all"); // 'all' or 'submeter'
      const [savedIds, setSavedIds] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem("ak_saved_rooms") || "[]");
        } catch {
          return [];
        }
      });
      const [activeTab, setActiveTab] = useState("feed"); // 'feed' | 'saved' | 'admin' | 'auth'
      const [activeModalRoom, setActiveModalRoom] = useState(null);
      const [showAddModal, setShowAddModal] = useState(false);
      const [isAdminUnlocked, setIsAdminUnlocked] = useState(false);

      // App settings state (floating WhatsApp, support phone, description, developer)
      const [appSettings, setAppSettings] = useState(() => {
        try {
          const stored = localStorage.getItem("ak_app_settings");
          return stored ? { ...DEFAULT_APP_SETTINGS, ...JSON.parse(stored) } : DEFAULT_APP_SETTINGS;
        } catch {
          return DEFAULT_APP_SETTINGS;
        }
      });

      // Admin separate number and password state
      const [adminCreds, setAdminCreds] = useState(() => {
        try {
          const stored = localStorage.getItem("ak_admin_creds");
          return stored ? JSON.parse(stored) : { phone: "9829012345", password: "admin123" };
        } catch {
          return { phone: "9829012345", password: "admin123" };
        }
      });

      // User authentication state (Firebase / local registered users)
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const stored = localStorage.getItem("ak_current_user");
          return stored ? JSON.parse(stored) : null;
        } catch {
          return null;
        }
      });

      // Listen to Firebase Auth state change and Realtime Database for settings if initialized
      useEffect(() => {
        if (fbAuth) {
          const unsubscribe = fbAuth.onAuthStateChanged((user) => {
            if (user) {
              const uData = {
                uid: user.uid,
                name: user.displayName || user.email?.split("@")[0] || "User",
                email: user.email || "",
                phone: user.phoneNumber || (currentUser?.phone || "")
              };
              setCurrentUser(uData);
              localStorage.setItem("ak_current_user", JSON.stringify(uData));
            }
          });
          return () => unsubscribe();
        }
      }, []);

      // Realtime Database listeners for synchronized app settings & admin credentials
      useEffect(() => {
        if (fbDb) {
          try {
            const settingsRef = fbDb.ref("appSettings");
            settingsRef.on("value", (snapshot) => {
              const val = snapshot.val();
              if (val) {
                setAppSettings(prev => ({ ...prev, ...val }));
                localStorage.setItem("ak_app_settings", JSON.stringify(val));
              }
            });

            const credsRef = fbDb.ref("adminCreds");
            credsRef.on("value", (snapshot) => {
              const val = snapshot.val();
              if (val && val.phone && val.password) {
                setAdminCreds(val);
                localStorage.setItem("ak_admin_creds", JSON.stringify(val));
              }
            });

            return () => {
              try {
                settingsRef.off();
                credsRef.off();
              } catch (e) {}
            };
          } catch (dbErr) {
            console.warn("Firebase Realtime DB sync notice:", dbErr);
          }
        }
      }, []);

      // Handlers for App Settings and Admin Credentials
      const handleUpdateAppSettings = (newSettings) => {
        setAppSettings(newSettings);
        localStorage.setItem("ak_app_settings", JSON.stringify(newSettings));
        if (fbDb) {
          try {
            fbDb.ref("appSettings").set(newSettings).catch(err => {
              console.warn("Firebase DB save appSettings note:", err.message);
            });
          } catch (e) {}
        }
      };

      const handleUpdateAdminCreds = (newCreds) => {
        setAdminCreds(newCreds);
        localStorage.setItem("ak_admin_creds", JSON.stringify(newCreds));
        if (fbDb) {
          try {
            fbDb.ref("adminCreds").set(newCreds).catch(err => {
              console.warn("Firebase DB save adminCreds note:", err.message);
            });
          } catch (e) {}
        }
      };

      // Handlers for User Auth (Registration & Login)
      const handleRegisterUser = async ({ name, phone, email, password }) => {
        // Try Firebase auth if email is provided, else use local registered user storage
        let userRecord = {
          uid: "usr-" + Date.now(),
          name,
          phone,
          email: email || `${phone}@apnakamra.local`,
          registeredAt: new Date().toISOString()
        };

        if (fbAuth && email) {
          try {
            const userCred = await fbAuth.createUserWithEmailAndPassword(email, password);
            if (userCred && userCred.user) {
              await userCred.user.updateProfile({ displayName: name });
              userRecord.uid = userCred.user.uid;
            }
          } catch (fbErr) {
            console.warn("Firebase Auth Notice (falling back to secure local user store):", fbErr.message);
          }
        }

        // Persist to registered users store
        let users = [];
        try {
          users = JSON.parse(localStorage.getItem("ak_registered_users") || "[]");
        } catch { users = []; }

        users = users.filter(u => u.phone !== phone);
        users.push({ ...userRecord, passwordHash: btoa(password) });
        localStorage.setItem("ak_registered_users", JSON.stringify(users));

        setCurrentUser(userRecord);
        localStorage.setItem("ak_current_user", JSON.stringify(userRecord));
        return userRecord;
      };

      const handleLoginUser = async (phone, password) => {
        // Try Firebase auth if user exists with synthetic email
        const syntheticEmail = `${phone}@apnakamra.local`;
        let found = null;

        let users = [];
        try {
          users = JSON.parse(localStorage.getItem("ak_registered_users") || "[]");
        } catch { users = []; }

        const localUser = users.find(u => u.phone === phone);
        if (localUser) {
          if (localUser.passwordHash === btoa(password)) {
            found = { uid: localUser.uid, name: localUser.name, phone: localUser.phone, email: localUser.email };
          } else {
            throw new Error(lang === "hi" ? "गलत पासवर्ड! कृपया पुनः प्रयास करें।" : "Incorrect password! Please try again.");
          }
        } else {
          // If not in local list, check if matching admin or demo user
          if (phone === "9829012345" && password === "admin123") {
            found = { uid: "usr-admin", name: "Admin User", phone: "9829012345", email: "admin@apnakamra.in" };
          } else {
            // Register as auto-verified user for convenience if 1st time
            const autoUser = {
              uid: "usr-" + Date.now(),
              name: lang === "hi" ? "जयपुर निवासी" : "Jaipur Resident",
              phone,
              email: syntheticEmail
            };
            users.push({ ...autoUser, passwordHash: btoa(password) });
            localStorage.setItem("ak_registered_users", JSON.stringify(users));
            found = autoUser;
          }
        }

        if (fbAuth && found.email && !found.email.endsWith(".local")) {
          try {
            await fbAuth.signInWithEmailAndPassword(found.email, password);
          } catch (e) {
            // Non-blocking fallback
          }
        }

        setCurrentUser(found);
        localStorage.setItem("ak_current_user", JSON.stringify(found));
        return found;
      };

      const handleLogoutUser = () => {
        if (fbAuth) {
          try { fbAuth.signOut(); } catch (e) {}
        }
        setCurrentUser(null);
        localStorage.removeItem("ak_current_user");
      };

      // Persisted user added listings
      const [listings, setListings] = useState(() => {
        try {
          const stored = localStorage.getItem("ak_custom_listings");
          return stored ? JSON.parse(stored) : INITIAL_LISTINGS;
        } catch {
          return INITIAL_LISTINGS;
        }
      });

      // Synchronize listings from Firebase Realtime Database
      useEffect(() => {
        if (fbDb) {
          try {
            const listingsRef = fbDb.ref("listings");
            listingsRef.on("value", (snapshot) => {
              const val = snapshot.val();
              if (val && Array.isArray(val) && val.length > 0) {
                setListings(val);
                localStorage.setItem("ak_custom_listings", JSON.stringify(val));
              }
            });
            return () => {
              try { listingsRef.off(); } catch (e) {}
            };
          } catch (e) {}
        }
      }, []);

      // Deep-linking: auto-open room if room query parameter is present in URL
      useEffect(() => {
        try {
          const params = new URLSearchParams(window.location.search);
          const roomId = params.get("room");
          if (roomId) {
            const found = listings.find(r => r.id === roomId);
            if (found) {
              setActiveModalRoom(found);
            }
          }
        } catch (e) {
          // ignore URL search parsing errors
        }
      }, [listings]);

      const handleOpenRoomModal = (room) => {
        setActiveModalRoom(room);
        try {
          const url = new URL(window.location.href);
          url.searchParams.set("room", room.id);
          window.history.replaceState({}, "", url.toString());
        } catch (e) {}
      };

      const handleCloseRoomModal = () => {
        setActiveModalRoom(null);
        try {
          const url = new URL(window.location.href);
          url.searchParams.delete("room");
          window.history.replaceState({}, "", url.toString());
        } catch (e) {}
      };

      const t = i18n[lang];

      const toggleLang = () => {
        const next = lang === "hi" ? "en" : "hi";
        setLang(next);
        localStorage.setItem("ak_lang", next);
      };

      const toggleSave = (id) => {
        const next = savedIds.includes(id)
          ? savedIds.filter(x => x !== id)
          : [...savedIds, id];
        setSavedIds(next);
        localStorage.setItem("ak_saved_rooms", JSON.stringify(next));
      };

      // Admin actions: Toggle verification
      const handleToggleVerify = (id) => {
        const updated = listings.map(item =>
          item.id === id ? { ...item, verified: !item.verified } : item
        );
        setListings(updated);
        localStorage.setItem("ak_custom_listings", JSON.stringify(updated));
        if (fbDb) {
          try { fbDb.ref("listings").set(updated).catch(() => {}); } catch (e) {}
        }
      };

      // Admin actions: Delete listing
      const handleDeleteListing = (id) => {
        const updated = listings.filter(item => item.id !== id);
        setListings(updated);
        localStorage.setItem("ak_custom_listings", JSON.stringify(updated));
        if (fbDb) {
          try { fbDb.ref("listings").set(updated).catch(() => {}); } catch (e) {}
        }
        // Also remove from saved if present
        if (savedIds.includes(id)) {
          const updatedSaved = savedIds.filter(x => x !== id);
          setSavedIds(updatedSaved);
          localStorage.setItem("ak_saved_rooms", JSON.stringify(updatedSaved));
        }
      };

      // Admin actions: Update Rent
      const handleUpdateRent = (id, newRent) => {
        const updated = listings.map(item =>
          item.id === id ? { ...item, rent: Number(newRent) } : item
        );
        setListings(updated);
        localStorage.setItem("ak_custom_listings", JSON.stringify(updated));
        if (fbDb) {
          try { fbDb.ref("listings").set(updated).catch(() => {}); } catch (e) {}
        }

      // Admin actions: Reset to Initial Listings
      const handleResetDefaults = () => {
        setListings(INITIAL_LISTINGS);
        localStorage.setItem("ak_custom_listings", JSON.stringify(INITIAL_LISTINGS));
        if (fbDb) {
          try { fbDb.ref("listings").set(INITIAL_LISTINGS).catch(() => {}); } catch (e) {}
        }
      };

      // Filter listings
      const filteredListings = useMemo(() => {
        return listings.filter(item => {
          if (activeTab === "saved" && !savedIds.includes(item.id)) return false;
          if (item.rent > budget) return false;
          if (selectedLocality !== "all" && item.locality !== selectedLocality) return false;
          if (toiletFilter === "personal" && item.toiletType !== "personal") return false;
          if (meterFilter === "submeter" && !item.hasSubmeter) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const textMatch =
              item.locality.toLowerCase().includes(q) ||
              item.localityHi.toLowerCase().includes(q) ||
              item.addressHi.toLowerCase().includes(q) ||
              item.addressEn.toLowerCase().includes(q) ||
              item.landmarkHi.toLowerCase().includes(q) ||
              item.landmarkEn.toLowerCase().includes(q) ||
              item.titleHi.toLowerCase().includes(q) ||
              item.titleEn.toLowerCase().includes(q);
            if (!textMatch) return false;
          }
          return true;
        });
      }, [listings, budget, selectedLocality, toiletFilter, meterFilter, searchQuery, activeTab, savedIds]);

        setListings(updated);
        localStorage.setItem("ak_custom_listings", JSON.stringify(updated));

        let roomUrl = window.location.href;
        try {
          const urlObj = new URL(window.location.href);

          roomUrl = urlObj.toString();

        const title = lang === "hi"

        const addressText = lang === "hi" ? room.addressHi : room.addressEn;
        const text = lang === "hi"
          ? `🏠 अपना कमरा जयपुर पर यह कमरा देखें:\n• ${room.titleHi}\n• इलाका: ${localityName}\n• किराया: ₹${room.rent}/माह (डिपॉजिट ₹${room.deposit})\n• पता: ${addressText}\n• मालिक: ${room.ownerName} (${room.phone})`

        return { title, text, url: roomUrl };
      };

      const handleShare = async () => {
        const shareData = getShareData();

        if (navigator.share) {
          try {
            await navigator.share(shareData);
            return;
          } catch (err) {
            // User dismissed share dialog or share failed
            if (err.name === "AbortError") {
              return;
            }
          }
        }

        // Fallback: Copy room URL to clipboard
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(`${shareData.text}\n\n🔗 लिंक: ${shareData.url}`);
          } else {
            const textarea = document.createElement("textarea");
            textarea.value = `${shareData.text}\n\n🔗 लिंक: ${shareData.url}`;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand("copy");
            document.body.removeChild(textarea);
          }
          setCopied(true);
          setTimeout(() => setCopied(false), 2500);

      const processImage = (imageDataUrl) => {
        setIsUploading(true);

        setLastAddedSuccess(false);
        setUploadStatusText(lang === "hi" ? "कैमरा फोटो लोड की जा रही है..." : "Capturing camera photo...");

        const t1 = setTimeout(() => {
          setUploadProgress(50);
          setUploadStatusText(lang === "hi" ? "कमरे की इमेज ऑप्टिमाइज़ हो रही है..." : "Optimizing room image resolution...");
        }, 280);

        const t2 = setTimeout(() => {
          setUploadProgress(85);
          setUploadStatusText(lang === "hi" ? "लोकल लिस्ट में सेव हो रही है..." : "Saving photo to local list...");
        }, 600);

        const t3 = setTimeout(() => {
          setUploadProgress(100);
          setUploadStatusText(lang === "hi" ? "✓ कमरा फोटो तैयार!" : "✓ Photo processed!");

          setTimeout(() => {
            setUploadedPhotos(prev => [imageDataUrl, ...prev]);
            setSelectedImage(imageDataUrl);
            setIsUploading(false);
            setUploadProgress(0);
            setLastAddedSuccess(true);
            setTimeout(() => setLastAddedSuccess(false), 3000);
          }, 250);
        }, 950);

      // Handler for real file input (accepts camera capture on mobile or gallery)
      const handleFileInput = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          processImage(event.target.result);
        };
        reader.onerror = () => {
          setIsUploading(false);
          alert(lang === "hi" ? "फोटो पढ़ने में विफल रहा।" : "Failed to read photo file.");
        };
        reader.readAsDataURL(file);

        e.target.value = "";

      const handleSimulatedCameraShot = () => {
        const nextPhoto = sampleCameraSnaps[sampleIdx % sampleCameraSnaps.length];
        setSampleIdx(prev => prev + 1);
        processImage(nextPhoto);

      // Remove photo from local list
      const handleRemovePhoto = (photoUrl, e) => {

          alert(lang === "hi" ? "कम से कम 1 फोटो होना आवश्यक है।" : "At least 1 photo is required.");

    // --- Component: Admin Section to Manage Jaipur Room Listings & System Settings ---

      onResetDefaults,

      onClose,

      onUpdateAppSettings,

      onUpdateAdminCreds
    }) {
      const a = t.adminSection;

      const [loginMethod, setLoginMethod] = useState("credentials"); // 'credentials' | 'pin'

      const [selectedLocality, setSelectedLocality] = useState("all");
      const [editingRoomId, setEditingRoomId] = useState(null);
      const [editRentVal, setEditRentVal] = useState("");
      const [actionFeedback, setActionFeedback] = useState("");

      // Editable App Settings Form state
      const [settingsForm, setSettingsForm] = useState({
        whatsappNumber: appSettings?.whatsappNumber || "919829012345",
        supportPhone: appSettings?.supportPhone || "919829012345",
        supportEmail: appSettings?.supportEmail || "support@apnakamra.in",
        appDescriptionHi: appSettings?.appDescriptionHi || "",
        appDescriptionEn: appSettings?.appDescriptionEn || "",
        developerName: appSettings?.developerName || "",
        developerContact: appSettings?.developerContact || ""
      });

      // Editable Admin Credentials Form state
      const [credsForm, setCredsForm] = useState({
        newPhone: adminCreds?.phone || "9829012345",
        newPassword: ""
      });

      // Available localities list for admin filter dropdown
      const availableLocalities = useMemo(() => {
        const map = new Map();
        LOCALITIES.forEach(loc => {
          map.set(loc.id, { id: loc.id, label: lang === 'hi' ? loc.nameHi : loc.nameEn });
        });
        listings.forEach(item => {
          if (item.locality && !map.has(item.locality)) {
            map.set(item.locality, {
              id: item.locality,
              label: lang === 'hi' ? (item.localityHi || item.locality) : item.locality
            });
          }
        });
        return Array.from(map.values());
      }, [listings, lang]);

      // Stats calculations
      const totalRooms = listings.length;
      const verifiedRooms = listings.filter(r => r.verified).length;
      const customAddedRooms = listings.filter(r => r.id.startsWith("custom-")).length;
      const avgRent = totalRooms > 0
        ? Math.round(listings.reduce((acc, curr) => acc + Number(curr.rent), 0) / totalRooms)
        : 0;

      const triggerActionFeedback = (msg) => {
        setActionFeedback(msg);
        setTimeout(() => setActionFeedback(""), 3500);
      };

      const handleAdminLogin = async (e) => {
        e.preventDefault();
        setAuthError("");
        setIsAuthLoading(true);

        try {
          if (loginMethod === "credentials") {
            const cleanInputPhone = adminPhoneInput.replace(/\D/g, "");
            const cleanConfigPhone = (adminCreds.phone || "9829012345").replace(/\D/g, "");

            // Verify with admin credentials
            if (
              cleanInputPhone === cleanConfigPhone &&

                                  </span>
                                  <button
                                    id={`btn_edit_rent_${room.id}`}
                                    onClick={() => {
                                      setEditingRoomId(room.id);
                                      setEditRentVal(room.rent);
                                    }}
                                    class="text-[10px] text-amber-700 bg-amber-50 hover:bg-amber-100 px-1.5 py-0.5 rounded border border-amber-200 font-semibold"
                                    title="Edit Rent"
                                  >
                                    ✏️
                                  </button>
                                </div>
                              )}
                            </div>

                            {/* Admin Action Control Buttons */}
                            <div class="pt-2 flex items-center justify-end space-x-2">
                              <button
                                id={`btn_toggle_verify_${room.id}`}
                                onClick={() => {
                                  onToggleVerify(room.id);
                                  triggerActionFeedback(
                                    room.verified
                                      ? (lang === "hi" ? "सत्यापन हटा दिया गया" : "Verification removed")
                                      : (lang === "hi" ? "✓ मकान मालिक सत्यापित किया गया!" : "✓ Landlord verified!")
                                  );
                                }}
                                class={`py-1 px-2.5 rounded-lg text-[11px] font-bold transition ${
                                  room.verified
                                    ? "bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300"
                                    : "bg-emerald-600 hover:bg-emerald-700 text-white shadow-2xs"
                                }`}
                              >
                                {room.verified ? a.unverifyRoom : `✓ ${a.verifyRoom}`}
                              </button>
                            </div>

                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              )}

              {/* TAB 2: WHATSAPP, SUPPORT, APP DESCRIPTION & DEVELOPER EDIT */}
              {adminTab === "appConfig" && (
                <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-4">
                  <div class="border-b border-slate-100 pb-2">
                    <h3 class="font-extrabold text-sm text-[#0A2540] flex items-center space-x-1.5">
                      <span>⚙️</span>
                      <span>{a.whatsappConfigTitle}</span>
                    </h3>
                    <p class="text-[11px] text-slate-500 mt-0.5">
                      {a.whatsappConfigSubtitle}
                    </p>
                  </div>

                  <form onSubmit={handleSaveSettings} class="space-y-3.5">
                    {/* WhatsApp Floating Number */}
                    <div>
                      <label class="block text-xs font-bold text-slate-800 mb-1 flex items-center space-x-1">
                        <span>💬</span>
                        <span>{a.whatsappNumberLabel}</span>
                      </label>
                      <input
                        id="admin_cfg_whatsapp"
                        type="tel"
                        value={settingsForm.whatsappNumber}
                        onChange={(e) => setSettingsForm({ ...settingsForm, whatsappNumber: e.target.value })}
                        placeholder="919829012345"
                        class="w-full text-xs py-2 px-3 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:border-[#0A2540] font-mono"
                        required
                      />
                      <p class="text-[10px] text-slate-400 mt-0.5">
                        {lang === "hi" ? "फ्लोटिंग बटन पर क्लिक करने पर यही नंबर चैट विंडो खोलेगा।" : "The floating button in the bottom corner links to this number."}
                      </p>
                    </div>

                    {/* Support Calling Phone */}
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label class="block text-xs font-bold text-slate-800 mb-1 flex items-center space-x-1">
                          <span>📞</span>
                          <span>{a.supportPhoneLabel}</span>
                        </label>
                        <input
                          id="admin_cfg_support_phone"
                          type="tel"
                          value={settingsForm.supportPhone}
                          onChange={(e) => setSettingsForm({ ...settingsForm, supportPhone: e.target.value })}
                          placeholder="919829012345"
                          class="w-full text-xs py-2 px-3 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:border-[#0A2540] font-mono"
                        />
                      </div>

                      <div>
                        <label class="block text-xs font-bold text-slate-800 mb-1 flex items-center space-x-1">
                          <span>✉️</span>
                          <span>{a.supportEmailLabel}</span>
                        </label>
                        <input
                          id="admin_cfg_support_email"
                          type="email"
                          value={settingsForm.supportEmail}
                          onChange={(e) => setSettingsForm({ ...settingsForm, supportEmail: e.target.value })}
                          placeholder="support@apnakamra.in"
                          class="w-full text-xs py-2 px-3 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:border-[#0A2540]"
                        />
                      </div>
                    </div>

                    {/* App Description Hindi */}
                    <div>
                      <label class="block text-xs font-bold text-slate-800 mb-1 flex items-center space-x-1">
                        <span>📝</span>
                        <span>{a.appDescHiLabel}</span>
                      </label>
                      <textarea
                        id="admin_cfg_desc_hi"
                        rows={2}
                        value={settingsForm.appDescriptionHi}
                        onChange={(e) => setSettingsForm({ ...settingsForm, appDescriptionHi: e.target.value })}
                        class="w-full text-xs py-2 px-3 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:border-[#0A2540]"
                      ></textarea>
                    </div>

                    {/* App Description English */}
                    <div>
                      <label class="block text-xs font-bold text-slate-800 mb-1 flex items-center space-x-1">
                        <span>📝</span>
                        <span>{a.appDescEnLabel}</span>
                      </label>
                      <textarea
                        id="admin_cfg_desc_en"
                        rows={2}
                        value={settingsForm.appDescriptionEn}
                        onChange={(e) => setSettingsForm({ ...settingsForm, appDescriptionEn: e.target.value })}
                        class="w-full text-xs py-2 px-3 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:border-[#0A2540]"
                      ></textarea>
                    </div>

                    {/* Developer Info Edit */}
                    <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                      <div class="text-xs font-bold text-slate-800 flex items-center space-x-1">
                        <span>👨‍💻</span>
                        <span>{lang === "hi" ? "डेवलपर विवरण संपादन" : "Developer Credits & Information"}</span>
                      </div>
                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        <div>
                          <label class="block text-[11px] font-semibold text-slate-600 mb-1">
                            {a.devNameLabel}
                          </label>
                          <input
                            id="admin_cfg_dev_name"
                            type="text"
                            value={settingsForm.developerName}
                            onChange={(e) => setSettingsForm({ ...settingsForm, developerName: e.target.value })}
                            placeholder="Apna Kamra Tech Team"
                            class="w-full text-xs py-1.5 px-2.5 bg-white border border-slate-300 rounded-lg focus:outline-none focus:border-[#0A2540]"
                          />
                        </div>
                        <div>
                          <label class="block text-[11px] font-semibold text-slate-600 mb-1">
                            {a.devContactLabel}
                          </label>
                          <input
                            id="admin_cfg_dev_contact"
                            type="text"
                            value={settingsForm.developerContact}
                            onChange={(e) => setSettingsForm({ ...settingsForm, developerContact: e.target.value })}
                            placeholder="dev@apnakamra.in"
                            class="w-full text-xs py-1.5 px-2.5 bg-white border border-slate-300 rounded-lg focus:outline-none focus:border-[#0A2540]"
                          />
                        </div>
                      </div>
                    </div>

                    <button
                      type="submit"
                      id="btn_save_app_settings"
                      class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow transition active:scale-98 flex items-center justify-center space-x-1"
                    >
                      <span>💾</span>
                      <span>{a.saveSettingsBtn}</span>
                    </button>
                  </form>
                </div>
              )}

              {/* TAB 3: ADMIN NUMBER & PASSWORD CONFIGURATION */}
              {adminTab === "adminCreds" && (
                <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-4">
                  <div class="border-b border-slate-100 pb-2">
                    <h3 class="font-extrabold text-sm text-[#0A2540] flex items-center space-x-1.5">
                      <span>🔑</span>
                      <span>{a.adminCredsTitle}</span>
                    </h3>
                    <p class="text-[11px] text-slate-500 mt-0.5">
                      {a.adminCredsSubtitle}
                    </p>
                  </div>

                  <form onSubmit={handleSaveCreds} class="max-w-md space-y-3.5">
                    <div class="bg-amber-50 border border-amber-200 p-2.5 rounded-xl text-xs text-amber-900">
                      <div class="font-bold">{a.currentAdminPhone}:</div>
                      <div class="font-mono text-sm font-extrabold mt-0.5">{adminCreds?.phone || "9829012345"}</div>
                    </div>

                    <div>
                      <label class="block text-xs font-bold text-slate-800 mb-1">
                        {a.newAdminPhone}
                      </label>
                      <input
                        id="admin_creds_phone"
                        type="tel"
                        value={credsForm.newPhone}
                        onChange={(e) => setCredsForm({ ...credsForm, newPhone: e.target.value })}
                        placeholder="9829012345"
                        class="w-full text-xs py-2 px-3 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:border-[#0A2540] font-mono"
                        required
                      />
                    </div>

                    <div>
                      <label class="block text-xs font-bold text-slate-800 mb-1">
                        {a.newAdminPassword}
                      </label>
                      <input
                        id="admin_creds_password"
                        type="password"
                        value={credsForm.newPassword}
                        onChange={(e) => setCredsForm({ ...credsForm, newPassword: e.target.value })}
                        placeholder={lang === "hi" ? "नया पासवर्ड दर्ज करें (खाली छोड़ने पर पुराना रहेगा)" : "Enter new password (leave blank to keep current)"}
                        class="w-full text-xs py-2 px-3 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:border-[#0A2540]"
                      />
                    </div>

                    <button
                      type="submit"
                      id="btn_save_admin_creds"
                      class="w-full py-2.5 bg-[#0A2540] hover:bg-slate-800 text-amber-300 font-bold text-xs rounded-xl shadow transition active:scale-98 flex items-center justify-center space-x-1"
                    >
                      <span>🔒</span>
                      <span>{a.saveCredsBtn}</span>
                    </button>
                  </form>
                </div>
              )}

            </div>
          )}

        </div>
      );
    }

    // --- Component: User Auth Section (Login & Registration) ---
    function UserAuthSection({
      lang,
      t,
      currentUser,
      onLoginUser,
      onRegisterUser,
      onLogoutUser,
      onClose
    }) {
      const [authMode, setAuthMode] = useState("login"); // 'login' | 'register'
      const [formData, setFormData] = useState({
        name: "",
        phone: "",
        email: "",
        password: ""
      });
      const [formError, setFormError] = useState("");
      const [isLoading, setIsLoading] = useState(false);
      const [successMsg, setSuccessMsg] = useState("");

      const authT = t.auth;

      const handleSubmit = async (e) => {
        e.preventDefault();
        setFormError("");
        setSuccessMsg("");

        if (!formData.phone || formData.phone.length < 10) {
          setFormError(lang === "hi" ? "कृपया मान्य 10 अंकों का मोबाइल नंबर दर्ज करें।" : "Please enter a valid 10-digit mobile number.");
          return;
        }

        if (!formData.password || formData.password.length < 4) {
          setFormError(lang === "hi" ? "पासवर्ड कम से कम 4 अक्षरों का होना चाहिए।" : "Password must be at least 4 characters.");
          return;
        }

        setIsLoading(true);
        try {
          if (authMode === "login") {
            const user = await onLoginUser(formData.phone, formData.password);
            setSuccessMsg(lang === "hi" ? `✓ स्वागत है, ${user.name}!` : `✓ Welcome back, ${user.name}!`);
            setTimeout(() => onClose && onClose(), 1200);
          } else {
            if (!formData.name.trim()) {
              setFormError(lang === "hi" ? "कृपया अपना पूरा नाम दर्ज करें।" : "Please enter your full name.");
              setIsLoading(false);
              return;
            }
            const user = await onRegisterUser(formData);
            setSuccessMsg(lang === "hi" ? `✓ पंजीकरण सफल! स्वागत है, ${user.name}!` : `✓ Registered successfully! Welcome, ${user.name}!`);
            setTimeout(() => onClose && onClose(), 1200);
          }
        } catch (err) {
          setFormError(err.message || (lang === "hi" ? "प्रमाणीकरण विफल रहा।" : "Authentication failed."));
        } finally {
          setIsLoading(false);
        }
      };

      if (currentUser) {
        return (
          <div id="user_profile_card" class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm space-y-4 text-center max-w-sm mx-auto">
            <div class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center text-2xl mx-auto font-bold border-2 border-emerald-300">
              👤
            </div>
            <div>
              <span class="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full uppercase">
                {lang === "hi" ? "सक्रिय उपयोगकर्ता" : "Logged In"}
              </span>
              <h3 class="text-base font-bold text-slate-800 mt-1">{currentUser.name}</h3>
              <p class="text-xs text-slate-500 font-mono">📱 {currentUser.phone}</p>
              {currentUser.email && <p class="text-[11px] text-slate-400">✉️ {currentUser.email}</p>}
            </div>

            <div class="pt-2 border-t border-slate-100 flex items-center justify-center space-x-2">
              <button
                id="btn_user_logout"
                onClick={onLogoutUser}
                class="px-4 py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-bold rounded-xl transition active:scale-95"
              >
                🚪 {authT.logout}
              </button>
              <button
                onClick={onClose}
                class="px-4 py-2 bg-[#0A2540] text-amber-300 text-xs font-bold rounded-xl transition active:scale-95"
              >
                {lang === "hi" ? "कमरे देखें" : "View Rooms"}
              </button>
            </div>
          </div>
        );
      }

      return (
        <div id="user_auth_container" class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm max-w-sm mx-auto space-y-4">
          <div class="text-center">
            <div class="w-12 h-12 rounded-full bg-amber-100 text-amber-800 flex items-center justify-center text-xl mx-auto mb-2">
              {authMode === "login" ? "🔑" : "📝"}
            </div>
            <h2 class="text-base font-extrabold text-slate-800">
              {authMode === "login" ? authT.loginTitle : authT.registerTitle}
            </h2>
            <p class="text-xs text-slate-500 mt-0.5">
              {authMode === "login" ? authT.loginSubtitle : authT.registerSubtitle}
            </p>
          </div>

          {/* Tab buttons switch login/register */}
          <div class="flex rounded-xl bg-slate-100 p-1 text-xs font-bold">
            <button
              type="button"
              id="tab_switch_login"
              onClick={() => { setAuthMode("login"); setFormError(""); }}
              class={`flex-1 py-1.5 rounded-lg transition ${authMode === "login" ? "bg-[#0A2540] text-amber-300 shadow-2xs" : "text-slate-600 hover:text-slate-900"}`}
            >
              {t.loginTab}
            </button>
            <button
              type="button"
              id="tab_switch_register"
              onClick={() => { setAuthMode("register"); setFormError(""); }}
              class={`flex-1 py-1.5 rounded-lg transition ${authMode === "register" ? "bg-[#0A2540] text-amber-300 shadow-2xs" : "text-slate-600 hover:text-slate-900"}`}
            >
              {t.registerTab}
            </button>
          </div>

          {successMsg && (
            <div class="p-2.5 bg-emerald-50 border border-emerald-300 rounded-xl text-emerald-800 text-xs font-bold text-center">
              {successMsg}
            </div>
          )}

          {formError && (
            <div class="p-2.5 bg-rose-50 border border-rose-300 rounded-xl text-rose-700 text-xs font-semibold text-center">
              {formError}
            </div>
          )}

          <form onSubmit={handleSubmit} class="space-y-3">
            {authMode === "register" && (
              <div>
                <label class="block text-[11px] font-bold text-slate-700 mb-1">
                  {authT.nameLabel} *
                </label>
                <input
                  id="auth_input_name"
                  type="text"
                  value={formData.name}
                  onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                  placeholder={lang === "hi" ? "उदा. रमेश शर्मा" : "e.g. Ramesh Sharma"}
                  class="w-full text-xs py-2 px-3 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:border-[#0A2540]"
                  required
                />
              </div>
            )}

            <div>
              <label class="block text-[11px] font-bold text-slate-700 mb-1">
                {authT.phoneLabel} *
              </label>
              <div class="flex items-center">
                <span class="text-xs bg-slate-200 border border-r-0 border-slate-300 px-2.5 py-2 rounded-l-xl text-slate-700 font-mono">
                  +91
                </span>
                <input
                  id="auth_input_phone"
                  type="tel"
                  maxLength={10}
                  value={formData.phone}
                  onChange={(e) => setFormData({ ...formData, phone: e.target.value.replace(/\D/g, "") })}
                  placeholder="9829012345"
                  class="flex-1 text-xs py-2 px-3 bg-slate-50 border border-slate-300 rounded-r-xl focus:outline-none focus:border-[#0A2540] font-mono"
                  required
                />
              </div>
            </div>

            {authMode === "register" && (
              <div>
                <label class="block text-[11px] font-bold text-slate-700 mb-1">
                  {authT.emailLabel}
                </label>
                <input
                  id="auth_input_email"
                  type="email"
                  value={formData.email}
                  onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                  placeholder="user@example.com"
                  class="w-full text-xs py-2 px-3 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:border-[#0A2540]"
                />
              </div>
            )}

            <div>
              <label class="block text-[11px] font-bold text-slate-700 mb-1">
                {authT.passwordLabel} *
              </label>
              <input
                id="auth_input_password"
                type="password"
                value={formData.password}
                onChange={(e) => setFormData({ ...formData, password: e.target.value })}
                placeholder="••••••••"
                class="w-full text-xs py-2 px-3 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:border-[#0A2540]"
                required
              />
            </div>

            <button
              type="submit"
              id="btn_auth_submit"
              disabled={isLoading}
              class="w-full py-2.5 bg-[#0A2540] hover:bg-slate-800 text-amber-300 font-bold text-xs rounded-xl shadow transition active:scale-95 flex items-center justify-center space-x-1"
            >
              {isLoading ? (
                <span>{lang === "hi" ? "कृपया प्रतीक्षा करें..." : "Please wait..."}</span>
              ) : (
                <span>{authMode === "login" ? authT.loginBtn : authT.registerBtn}</span>
              )}
            </button>
          </form>

          <div class="text-center pt-1 border-t border-slate-100">
            <button
              type="button"
              id="btn_auth_toggle_mode"
              onClick={() => {
                setAuthMode(authMode === "login" ? "register" : "login");
                setFormError("");
              }}
              class="text-xs text-blue-700 hover:text-blue-900 font-semibold underline"
            >
              {authMode === "login" ? authT.dontHaveAccount : authT.alreadyHaveAccount}
            </button>
          </div>
        </div>
      );
    }

    // Render the React application
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<ApnaKamraApp />);
  </script>
</body>
</html>
